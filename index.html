<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mukhtarat Online — قريباً</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F1;
    --sand:#EFE6D8;
    --sage:#8FA58C;
    --sage-deep:#5F7359;
    --clay:#DCA898;
    --gold:#C6A87C;
    --ink:#2C3630;
    --muted:#7C857E;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    font-family:'Tajawal', system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ خلفية ناعمة ============ */
  .blob{
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    pointer-events: none;
    z-index: 0;
  }
  .b1{ width:540px; height:540px; background:#CFE0C9; top:-170px; right:-140px; animation: drift1 20s ease-in-out infinite; }
  .b2{ width:480px; height:480px; background:#F5DCD2; bottom:-180px; left:-140px; animation: drift2 24s ease-in-out infinite; }
  .b3{ width:400px; height:400px; background:#EDE0C6; top:35%; left:38%; animation: drift1 30s ease-in-out infinite reverse; }

  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-40px, 50px) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(50px, -40px) scale(1.1); }
  }

  /* ============ المنتجات المتطايرة ============ */
  .flyer{
    position: fixed;
    top: var(--y);
    left: 0;
    font-size: var(--s);
    line-height: 1;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    filter: drop-shadow(0 14px 20px rgba(44,54,48,.14));
    animation: fly var(--dur) linear infinite;
    animation-delay: var(--delay);
    will-change: transform;
  }

  @keyframes fly{
    0%   { transform: translate(-22vw, 0)      rotate(var(--r1)) scale(.85); opacity:0; }
    10%  { opacity:.95; }
    90%  { opacity:.95; }
    100% { transform: translate(116vw, -12vh)  rotate(var(--r2)) scale(1.05); opacity:0; }
  }

  @keyframes flyRev{
    0%   { transform: translate(116vw, 0)      rotate(var(--r2)) scale(.85); opacity:0; }
    10%  { opacity:.95; }
    90%  { opacity:.95; }
    100% { transform: translate(-22vw, 10vh)   rotate(var(--r1)) scale(1.05); opacity:0; }
  }

  .flyer.rev{ animation-name: flyRev; }

  /* ============ أدوات التسوق ============ */
  .tools{
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .tool{
    position: absolute;
    width: var(--sz);
    height: var(--sz);
    display: grid;
    place-items: center;
    border-radius: 24px;
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(255,255,255,.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--sage-deep);
    box-shadow: 0 20px 45px -20px rgba(44,54,48,.45);
    animation: bob var(--bob) ease-in-out infinite;
    animation-delay: var(--d);
  }

  .tool svg{
    width: 52%;
    height: 52%;
  }

  .tool.clay{ color:#B88170; }
  .tool.gold{ color:#A9885C; }

  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(var(--rot)); }
    50%    { transform: translateY(-18px) rotate(calc(var(--rot) * -1)); }
  }

  /* ============ البطاقة الرئيسية ============ */
  .wrap{
    position: relative;
    z-index: 5;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .card{
    width: min(94vw, 620px);
    padding: clamp(32px, 5vw, 58px) clamp(22px, 4.5vw, 48px) clamp(28px, 4vw, 44px);
    border-radius: 36px;
    text-align: center;
    background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.9);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    box-shadow:
      0 40px 90px -40px rgba(44,54,48,.35),
      0 2px 0 rgba(255,255,255,.7) inset;
    animation: rise 1.1s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(28px) scale(.97); }
    to  { opacity:1; transform: translateY(0) scale(1); }
  }

  .badge{
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: .5px;
    color: var(--sage-deep);
    background: rgba(143,165,140,.14);
    border: 1px solid rgba(143,165,140,.28);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
  }

  .badge .dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--sage);
    box-shadow: 0 0 0 0 rgba(143,165,140,.6);
    animation: ping 2s ease-out infinite;
  }

  @keyframes ping{
    0%   { box-shadow: 0 0 0 0 rgba(143,165,140,.55); }
    70%  { box-shadow: 0 0 0 9px rgba(143,165,140,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,165,140,0); }
  }

  h1{
    font-size: clamp(64px, 15vw, 128px);
    font-weight: 900;
    line-height: .95;
    letter-spacing: -1px;
    background: linear-gradient(115deg, #6E8467 0%, #A9BE9F 30%, #C6A87C 62%, #DCA898 100%);
    background-size: 220% 220%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shift 9s ease-in-out infinite;
    margin-bottom: 10px;
  }

  @keyframes shift{
    0%,100%{ background-position: 0% 50%; }
    50%    { background-position: 100% 50%; }
  }

  .line{
    width: 62px;
    height: 3px;
    margin: 18px auto 22px;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: .8;
  }

  .subtitle{
    font-size: clamp(17px, 2.4vw, 20px);
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .desc{
    font-size: clamp(14px, 2vw, 15.5px);
    font-weight: 400;
    line-height: 1.9;
    color: var(--muted);
    max-width: 420px;
    margin: 0 auto;
  }

  /* ============ الاشتراك ============ */
  .subscribe{
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 30px auto 0;
    max-width: 430px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,.8);
    border: 1px solid rgba(44,54,48,.09);
    box-shadow: 0 14px 34px -22px rgba(44,54,48,.6);
  }

  .subscribe input{
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    padding: 12px 18px;
  }

  .subscribe input::placeholder{ color: #A9B0AA; }

  .subscribe button{
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    white-space: nowrap;
    color: #fff;
    border: 0;
    cursor: pointer;
    padding: 13px 26px;
    border-radius: 999px;
    background: linear-gradient(135deg, #7D9376, #5F7359);
    box-shadow: 0 12px 24px -12px rgba(95,115,89,.9);
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, filter .25s;
  }

  .subscribe button:hover{
    transform: translateY(-2px);
    filter: brightness(1.06);
    box-shadow: 0 18px 30px -14px rgba(95,115,89,.95);
  }

  .subscribe button:active{ transform: translateY(0) scale(.98); }

  .msg{
    font-size: 13.5px;
    font-weight: 500;
    color: var(--sage-deep);
    height: 20px;
    margin-top: 14px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .35s, transform .35s;
  }

  .msg.show{ opacity: 1; transform: translateY(0); }

  .footer{
    margin-top: 26px;
    font-size: 12px;
    letter-spacing: .6px;
    color: #A3ABA5;
  }

  /* ============ استجابة الشاشات ============ */
  @media (max-width: 900px){
    .tool{ display: none; }
    .tool.keep{ display: grid; }
  }

  @media (max-width: 520px){
    .tool.keep{ display: none; }
    .subscribe{ flex-direction: column; border-radius: 24px; }
    .subscribe input{ width: 100%; text-align: center; padding: 14px; }
    .subscribe button{ width: 100%; }
    .card{ border-radius: 28px; }
  }

  @media (max-height: 700px){
    h1{ font-size: clamp(54px, 12vw, 88px); }
    .card{ padding-top: 30px; padding-bottom: 26px; }
    .desc{ line-height: 1.7; }
    .subscribe{ margin-top: 22px; }
  }

  /* ============ تقليل الحركة ============ */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001s !important;
    }
    .flyer{ display: none; }
  }
</style>
</head>
<body>

  <!-- خلفية -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- منتجات متطايرة -->
  <div class="flyer"        style="--y:6%;  --s:40px; --dur:27s; --delay:-4s;   --r1:-20deg; --r2:25deg;">👜</div>
  <div class="flyer rev"    style="--y:16%; --s:30px; --dur:33s; --delay:-12s;  --r1:18deg;  --r2:-22deg;">👟</div>
  <div class="flyer"        style="--y:24%; --s:36px; --dur:22s; --delay:-7s;   --r1:-14deg; --r2:20deg;">🎧</div>
  <div class="flyer rev"    style="--y:33%; --s:28px; --dur:29s; --delay:-18s;  --r1:12deg;  --r2:-18deg;">⌚</div>
  <div class="flyer"        style="--y:42%; --s:34px; --dur:25s; --delay:-2s;   --r1:-24deg; --r2:16deg;">🧴</div>
  <div class="flyer rev"    style="--y:50%; --s:26px; --dur:36s; --delay:-22s;  --r1:20deg;  --r2:-26deg;">🕯️</div>
  <div class="flyer"        style="--y:58%; --s:32px; --dur:20s; --delay:-10s;  --r1:-16deg; --r2:24deg;">🕶️</div>
  <div class="flyer rev"    style="--y:66%; --s:38px; --dur:31s; --delay:-5s;   --r1:14deg;  --r2:-20deg;">🪴</div>
  <div class="flyer"        style="--y:74%; --s:28px; --dur:24s; --delay:-15s;  --r1:-22deg; --r2:18deg;">🧣</div>
  <div class="flyer rev"    style="--y:82%; --s:30px; --dur:28s; --delay:-9s;   --r1:16deg;  --r2:-24deg;">📷</div>
  <div class="flyer"        style="--y:90%; --s:26px; --dur:35s; --delay:-20s;  --r1:-12deg; --r2:22deg;">💄</div>
  <div class="flyer rev"    style="--y:12%; --s:24px; --dur:38s; --delay:-26s;  --r1:22deg;  --r2:-16deg;">🎒</div>

  <!-- أدوات تسوق عائمة -->
  <div class="tools" aria-hidden="true">

    <!-- سلة تسوق -->
    <div class="tool" style="top:13%; left:6.5%; --sz:76px; --rot:-8deg; --bob:6s; --d:-1s;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9.5" cy="20" r="1.4"/>
        <circle cx="18" cy="20" r="1.4"/>
        <path d="M2 3h2.6l2.2 11.1a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/>
      </svg>
    </div>

    <!-- حقيبة -->
    <div class="tool clay keep" style="top:20%; right:7.5%; --sz:68px; --rot:7deg; --bob:7s; --d:-3s;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.5 7.5h13l1 12.5h-15l1-12.5z"/>
        <path d="M9 7.5V5.8a3 3 0 0 1 6 0v1.7"/>
      </svg>
    </div>

    <!-- بطاقة دفع -->
    <div class="tool gold" style="bottom:20%; right:8.5%; --sz:74px; --rot:-6deg; --bob:6.5s; --d:-2s;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5.5" width="19" height="13" rx="2.6"/>
        <path d="M2.5 10h19"/>
        <path d="M6 15h4"/>
      </svg>
    </div>

    <!-- بطاقة سعر -->
    <div class="tool keep" style="bottom:15%; left:10.5%; --sz:64px; --rot:10deg; --bob:7.5s; --d:-4s;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12.2 12.2 3H20a1 1 0 0 1 1 1v7.8L11.8 21a1.5 1.5 0 0 1-2.1 0L3 14.3a1.5 1.5 0 0 1 0-2.1z"/>
        <circle cx="16.4" cy="7.6" r="1.4"/>
      </svg>
    </div>

    <!-- هدية -->
    <div class="tool clay" style="top:50%; left:3.2%; --sz:56px; --rot:-12deg; --bob:8s; --d:-5s;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="9" width="17.6" height="11.5" rx="2.2"/>
        <path d="M3.2 13.4h17.6M12 9v11.5"/>
        <path d="M12 9S10.6 3.8 8.1 3.8a2.6 2.6 0 0 0 0 5.2M12 9s1.4-5.2 3.9-5.2a2.6 2.6 0 0 1 0 5.2"/>
      </svg>
    </div>

    <!-- نجمة -->
    <div class="tool gold" style="top:70%; right:4.2%; --sz:50px; --rot:14deg; --bob:5.5s; --d:-1.5s;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.2 1 5.9L12 17.1 6.8 19.9l1-5.9L3.5 9.8l5.9-.9L12 3.6z"/>
      </svg>
    </div>

  </div>

  <!-- البطاقة الرئيسية -->
  <main class="wrap">
    <section class="card">

      <div class="badge">
        <span class="dot"></span>
        Mukhtarat Online
      </div>

      <h1>قريباً</h1>

      <div class="line"></div>

      <p class="subtitle">نُحضّر لك تجربة تسوّق مختلفة تماماً</p>

      <p class="desc">
        مختارات بعناية من المنتجات التي تستحقّ — وصول أسرع، تجربة أنظف،
        وتفاصيل مدروسة من أول ضغطة زر حتى وصول الطلب إلى بابك.
      </p>

      <form class="subscribe" id="form" novalidate>
        <input type="email" id="email" placeholder="بريدك الإلكتروني" autocomplete="email" required>
        <button type="submit">أعلمني أولاً</button>
      </form>

      <p class="msg" id="msg"></p>

      <p class="footer">© 2025 MUKHTARAT ONLINE</p>

    </section>
  </main>

<script>
  const form = document.getElementById('form');
  const emailInput = document.getElementById('email');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const value = emailInput.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);

    if (!valid) {
      msg.textContent = 'الرجاء إدخال بريد إلكتروني صحيح ✉️';
      msg.style.color = '#B88170';
      msg.classList.add('show');
      return;
    }

    msg.textContent = 'تم التسجيل بنجاح، سنخبرك أول من يعلم ✨';
    msg.style.color = '#5F7359';
    msg.classList.add('show');
    form.reset();

    setTimeout(() => msg.classList.remove('show'), 4500);
  });
</script>

</body>
</html>
